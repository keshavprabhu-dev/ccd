version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"
    volumes:
      - ccd-db-data:/app/server/db
      - ccd-upload-data:/app/server/uploads
    environment:
      - PORT=3000
    restart: always

volumes:
  ccd-db-data:
  ccd-upload-data:
