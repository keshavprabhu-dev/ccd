<div class="modal-overlay" *ngIf="visible" style="z-index: 2000;">
  <div class="modal-content" (click)="$event.stopPropagation()" style="max-width: 500px; text-align: center; padding: 2.5rem;">
    <div style="color: #ef4444; margin-bottom: 1.5rem;">
      <svg width="64" height="64" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin: 0 auto;">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
    </div>
    <h3 style="color: #1e293b; margin-bottom: 1rem;">Validation Error</h3>
    <p style="color: #64748b; line-height: 1.6; margin-bottom: 2rem; white-space: pre-wrap; text-align: left;">{{ message }}</p>
    <button type="button" class="btn-primary" (click)="dismiss.emit()">Go Back and Fix</button>
  </div>
</div>
